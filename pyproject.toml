
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-recursive-optimizer"
version = "0.3.0"
description = "Pi-recursive schedules and optimizers for ML (PyTorch-first). Now with CHAOS MODE!"
authors = [{name="Open Source Contributors"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.0,<3"]
license = {text = "MIT"}
keywords = ["optimization", "pytorch", "machine-learning", "optimizer", "chaos", "gremlin-mode"]

[project.optional-dependencies]
viz = ["matplotlib>=3.5", "numpy>=1.20"]
dev = ["pytest>=7.0", "matplotlib>=3.5", "numpy>=1.20"]
chaos = []  # Chaos mode needs no extra deps, just courage
all = ["matplotlib>=3.5", "numpy>=1.20", "pytest>=7.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/agentgptsmith/adaptive-sonic-pi-optimizer"
Issues = "https://github.com/agentgptsmith/adaptive-sonic-pi-optimizer/issues"
